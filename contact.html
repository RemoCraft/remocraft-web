<body>

          </div>
      </div>
    </div>
  </div>

  <!--Header-->
  <section id="header">
    <div class="content">
      <div class="info">
        <p class="minecraft-server-ip">play.remocraft.com</p>
        <h1 class="title"><span>Connect</span> with us</h1>
      </div>
      <p class="description">
        Do you have a problem and need to solve it? Write to us below.
      </p>
    </div>
  </section>

  <!--Contacts-->
  <section id="contacts">
    <div class="content">
      <h2 class="section-title">Contact</h2>

      <div class="columns">
        <form class="contact-form" action="" method="POST">
          <input type="hidden" name="_subject" value="Message From Website">
          <input type="hidden" name="_template" value="box">
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_next" value="" class="location-after-submit">

          <div class="row">
            <label for="name">* In-game username (or Real name)</label>
            <input type="text" required id="name" name="name" placeholder="RemoCraftMC">
          </div>
          <div class="row">
            <label for="discord-name">Discord username + tag</label>
            <input type="text" id="discord-name" name="discord-name" placeholder="RemoCraftMC#0000">
          </div>
          <div class="row">
            <label for="email">* Email</label>
            <input type="email" required id="email" name="email" placeholder="remocraft@example.com">
          </div>
          <div class="row">
            <label for="message">* Message</label>
            <textarea required id="message" name="message" placeholder="I have a question..."></textarea>
          </div>
          <div class="form-footer">
            <p class="alert">Fields marked with * are required</p>
            <button type="submit">Send Message <i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </form>

        <div class="discord-sidebar" style="display: flex; flex-direction: column; gap: 20px;">
          
          <a href="https://discord.gg/BNHeKg7u2U" class="url discord-link" target="_blank" rel="noopener noreferrer" style="width: 100%; display: block;">
            <div class="link">
              <h5>Join our Discord</h5>
              <div class="link-description">
                <p class="description">
                  For faster help and server updates, join our Discord. We respond quickly.
                  <br>-----------
                  <br><span class="discord-online-users">None</span> users online
                </p>
                <div class="icon">
                  <i class="fa-brands fa-discord"></i>
                </div>
              </div>
            </div>
          </a>

        </div>
      </div>
    </div>
  </section>

  <script src="js/script.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
